name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race matters here: a batch scan runs probes across goroutines that
      # share one httpx client and its rate limiter.
      - name: test
        run: go test -race ./...

      - name: validate probe templates load
        run: go run ./cmd/reap --list-probes --templates ./templates

  # Scanning the bundled fixtures is the only check that exercises the real
  # binary end to end. Both fixtures exist because bugs invisible against a
  # permissive server were obvious against a strict one.
  range-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: build
        run: go build -o bin/reap ./cmd/reap

      - name: scan the permissive fixture
        run: |
          python3 scripts/mock_mcp_server.py &
          sleep 2
          ./bin/reap -t http://127.0.0.1:8765/mcp --authorized --no-banner --output json --out mock.json
          python3 - <<'PY'
          import json
          rep = json.load(open("mock.json"))
          assert rep["status"] == "complete", rep.get("incomplete_reason")
          ids = {f["id"] for f in rep["findings"]}
          for want in ("mcp-unauth-tools-list", "transport-plaintext"):
              assert want in ids, f"missing {want}: {sorted(ids)}"
          print(f"ok: {len(ids)} finding ids")
          PY

      - name: scan the spec-strict fixture
        run: |
          python3 scripts/strict_mcp_server.py --port 8099 &
          sleep 2
          ./bin/reap -t http://127.0.0.1:8099/mcp --authorized --no-banner --output json --out strict.json
          python3 - <<'PY'
          import json
          rep = json.load(open("strict.json"))
          t = rep["target"]
          # Version negotiation: the fixture refuses reap's newest revision, so
          # a client that doesn't walk the ladder gets nothing at all.
          assert t["protocol_version"] == "2025-03-26", t
          # Pagination: 5 tools on page one, 1 on page two.
          assert t["capabilities"]["tools"] == 6, t.get("capabilities")
          assert rep["status"] == "complete", rep.get("incomplete_reason")
          print("ok: negotiated", t["protocol_version"], "with", t["capabilities"]["tools"], "tools")
          PY

      # An unreachable target must never look like a clean one.
      - name: unreachable target reports incomplete
        run: |
          set +e
          ./bin/reap -t http://127.0.0.1:9/mcp --authorized --no-banner --protocol mcp --output json --out dead.json
          code=$?
          set -e
          if [ "$code" != "3" ]; then echo "expected exit 3, got $code"; exit 1; fi
          python3 - <<'PY'
          import json
          rep = json.load(open("dead.json"))
          assert rep["status"] == "incomplete", rep
          print("ok: exit 3, status incomplete")
          PY

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
